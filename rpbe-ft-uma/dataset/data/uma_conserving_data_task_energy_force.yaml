normalizer_rmsd: 0.3782947291171177
train_dataset:
  splits:
    train:
      src: /workspace/fairchem/configs/uma/finetune/output/train
  format: ase_db
  transforms:
    common_transform:
      dataset_name: ${data.dataset_name}
    stress_reshape_transform:
      dataset_name: ${data.dataset_name}
val_dataset:
  splits:
    val:
      src: /workspace/fairchem/configs/uma/finetune/output/val
  format: ase_db
  transforms:
    common_transform:
      dataset_name: ${data.dataset_name}
    stress_reshape_transform:
      dataset_name: ${data.dataset_name}
regress_stress: true
pass_through_head_outputs: true
heads:
  efs:
    module: fairchem.core.models.uma.escn_md.MLP_EFS_Head
tasks_list:
- _target_: fairchem.core.units.mlip_unit.mlip_unit.Task
  name: energy
  level: system
  property: energy
  loss_fn:
    _target_: fairchem.core.modules.loss.DDPMTLoss
    loss_fn:
      _target_: fairchem.core.modules.loss.PerAtomMAELoss
    coefficient: 20
  out_spec:
    dim:
    - 1
    dtype: float32
  normalizer:
    _target_: fairchem.core.modules.normalization.normalizer.Normalizer
    mean: 0.0
    rmsd: ${data.normalizer_rmsd}
  element_references:
    _target_: fairchem.core.modules.normalization.element_references.ElementReferences
    element_references:
      _target_: torch.DoubleTensor
      _args_:
      - ${data.elem_refs}
  datasets:
  - ${data.dataset_name}
  metrics:
  - mae
  - per_atom_mae
- _target_: fairchem.core.units.mlip_unit.mlip_unit.Task
  name: forces
  level: atom
  property: forces
  train_on_free_atoms: true
  eval_on_free_atoms: true
  loss_fn:
    _target_: fairchem.core.modules.loss.DDPMTLoss
    loss_fn:
      _target_: fairchem.core.modules.loss.L2NormLoss
    reduction: mean
    coefficient: 2
  out_spec:
    dim:
    - 3
    dtype: float32
  normalizer:
    _target_: fairchem.core.modules.normalization.normalizer.Normalizer
    mean: 0.0
    rmsd: ${data.normalizer_rmsd}
  datasets:
  - ${data.dataset_name}
  metrics:
  - mae
  - cosine_similarity
  - magnitude_error
- _target_: fairchem.core.units.mlip_unit.mlip_unit.Task
  name: stress
  level: system
  property: stress
  out_spec:
    dim:
    - 1
    - 9
    dtype: float32
  normalizer:
    _target_: fairchem.core.modules.normalization.normalizer.Normalizer
    mean: 0.0
    rmsd: ${data.normalizer_rmsd}
  datasets:
  - ${data.dataset_name}
  inference_only: true
